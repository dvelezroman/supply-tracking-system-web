<div class="page-container">
  <app-page-header
    [title]="'marketplace.admin.settingsTitle' | transloco"
    [subtitle]="'marketplace.admin.settingsSubtitle' | transloco"
  />

  @if (isLoading()) {
    <mat-progress-bar mode="indeterminate" />
  } @else {
    <mat-card>
      <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="settings-form">
          <mat-slide-toggle formControlName="storeEnabled">
            {{ 'marketplace.admin.storeEnabled' | transloco }}
          </mat-slide-toggle>

          <mat-form-field appearance="outline">
            <mat-label>{{ 'marketplace.admin.orderEmail' | transloco }}</mat-label>
            <input matInput type="email" formControlName="orderNotificationEmail" />
            <mat-hint>{{ 'marketplace.admin.orderEmailHint' | transloco }}</mat-hint>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>{{ 'marketplace.admin.fromName' | transloco }}</mat-label>
            <input matInput formControlName="fromName" />
          </mat-form-field>

          <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || isSaving()">
            {{ 'common.save' | transloco }}
          </button>
        </form>
      </mat-card-content>
    </mat-card>
  }
</div>
