<div class="store">
  <header class="store__header">
    <div class="store__header-inner">
      <a routerLink="/" class="store__brand">
        @if (brand.logoUrl(); as logoSrc) {
          <img
            class="store__logo"
            [src]="logoSrc"
            alt=""
            width="120"
            height="36"
            (error)="brand.onLogoError($event)"
          />
        }
        <span class="store__title">{{ brand.landingTitle() }}</span>
      </a>

      <nav class="store__nav" aria-label="Tienda">
        <a
          routerLink="/tienda"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="store__nav-link"
        >
          {{ 'marketplace.store.navShop' | transloco }}
        </a>
        <a routerLink="/" class="store__nav-link">
          {{ 'marketplace.store.navHome' | transloco }}
        </a>
      </nav>

      <div class="store__actions">
        <app-language-toggle />
        <app-theme-toggle />
        <a
          routerLink="/tienda/carrito"
          class="store__cart"
          [attr.aria-label]="'marketplace.store.cart' | transloco"
        >
          <mat-icon>shopping_cart</mat-icon>
          @if (cart.itemCount() > 0) {
            <span class="store__cart-badge">{{ cart.itemCount() }}</span>
          }
        </a>
      </div>
    </div>
  </header>

  <main class="store__main">
    <router-outlet />
  </main>

  <footer class="store__footer">
    <p>{{ brand.landingTitle() }} · {{ 'marketplace.store.footer' | transloco }}</p>
  </footer>
</div>
