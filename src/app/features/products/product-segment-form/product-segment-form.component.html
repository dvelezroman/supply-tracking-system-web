<app-page-header
  [title]="(isEditMode() ? 'productSegments.editTitle' : 'productSegments.newTitle') | transloco"
  backRoute="/products/segments"
/>

@if (isLoading()) {
  <mat-progress-bar mode="indeterminate" />
}

<mat-card class="form-card">
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ 'productSegments.form.name' | transloco }}</mat-label>
        <input
          matInput
          formControlName="name"
          [placeholder]="'productSegments.form.namePlaceholder' | transloco"
        />
        @if (form.controls.name.hasError('required')) {
          <mat-error>{{ 'productSegments.form.nameRequired' | transloco }}</mat-error>
        }
      </mat-form-field>

      <div class="form-actions">
        <button mat-button type="button" (click)="onCancel()">{{ 'common.cancel' | transloco }}</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || isSaving()">
          @if (isSaving()) {
            <mat-spinner diameter="20" />
          } @else {
            {{ isEditMode() ? ('common.saveChanges' | transloco) : ('productSegments.createSegment' | transloco) }}
          }
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
